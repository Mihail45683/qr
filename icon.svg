<svg xmlns="http://w3.org" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Определение градиентов и стилей -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Задний фон (Занимает 100% для Maskable-версии) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Декоративный внутренний блик/градиент -->
  <rect width="512" height="512" rx="112" fill="url(#glowGrad)" pointer-events="none" />

  <!-- Безопасная зона (Центральные 80% — графическое ядро приложения) -->
  <g transform="translate(56, 56)">
    <!-- Внутренний круг-подложка для контраста логотипа -->
    <circle cx="200" cy="200" r="140" fill="#FFFFFF" opacity="0.15" />
    
    <!-- Абстрактный современный логотип (Молния + Слои) -->
    <path d="M220 70 L110 230 L190 230 L180 330 L290 170 L210 170 Z" 
          fill="#FFFFFF" 
          stroke="#FFFFFF" 
          stroke-width="8" 
          stroke-linejoin="round" />
  </g>
</svg>
 